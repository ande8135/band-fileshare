<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
  <title>VDI File Share</title>
  <!--PRECONNECT-->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Signed-in app shell -->
  <div id="shell" hidden>
    <nav id="side">
      <div class="brand"><img src="logo.png" alt="" width="26" height="26"><span>VDI File Share</span></div>
      <div class="nav" id="nav">
        <a href="#/" data-view="files"><span class="i" data-icon="folder"></span><span>Files</span></a>
        <a href="#/trash" data-view="trash"><span class="i" data-icon="trash"></span><span>Trash</span></a>
        <a href="#/members" data-view="members" id="navMembers" hidden><span class="i" data-icon="users"></span><span>Members</span></a>
      </div>
      <button id="me" class="me" aria-haspopup="menu"></button>
    </nav>

    <main id="main">
      <div id="view"></div>
    </main>
  </div>

  <aside id="panel" hidden aria-label="File details">
    <div class="p-head" id="pHead"></div>
    <div class="p-actions" id="pActions"></div>
    <div class="tabs" id="pTabs" role="tablist"></div>
    <div class="p-body" id="pBody"></div>
    <form class="composer" id="composer">
      <textarea id="cText" rows="1" maxlength="4000" placeholder="Write a comment…" aria-label="Comment"></textarea>
      <div class="composer-row">
        <select id="cVersion" aria-label="Comment applies to"></select>
        <span class="hint">⌘↵ to send</span>
        <button class="btn primary sm" id="cSend">Send</button>
      </div>
    </form>
  </aside>

  <div id="dropOverlay" hidden><div><span class="i" data-icon="upload"></span><p id="dropText">Drop to upload</p></div></div>
  <div id="tray" hidden></div>
  <input id="picker" type="file" multiple hidden>
  <input id="verPicker" type="file" hidden>

  <!-- Signed-out / blocked states -->
  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <img src="logo.png" alt="Volcano Diving Inc" width="88" height="88">
      <h1>VDI File Share</h1>
      <p id="gateMsg">Sign in to access the shared files.<br>Access is by invitation only.</p>
      <p id="gateErr" class="err"></p>
      <button id="gateBtn" class="btn primary lg">Sign in</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
